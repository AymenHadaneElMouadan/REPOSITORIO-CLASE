<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <h1>Eventos para animaciones</h1>

    <h2>Contador: <span id="tSpnCounter">0</span></h2>
    
    <script type="module">
        let counter = 0;

        const nSvg = document.querySelector('svg.hand')
        /* nSvg.style.animationIterationCount = nSvg.getAttribute('data-spins') */
        nSvg.style.animationIterationCount = nSvg.dataset.spins;

        nSvg.addEventListener('animationstart', _ => {
            document.querySelector('#tSpnCounter').textContent = 0;
        });

        nSvg.addEventListener('animationend', _ => {
            document.querySelector('#tSpnCounter').textContent = 'FIN';
            document.querySelector('svg.circle').style.animationPlayState = 'running';
        });
        nSvg.addEventListener('animationiteration', e => {
            document.querySelector('#tSpnCounter').textContent = ++counter;
        });

        document.querySelector('svg.circle').addEventListener('animationend', = =>{
            
        })
    </script>

    <main>     
        <svg class="hand" version="1.1"
        xmlns="http://www.w3.org/2000/svg"
        style="width: 210px; height: 35px;"
        data-spins= "5";
        > 
        <line x1="000" y1="000" x2="200" y2="000" stroke="#ff0000" stroke-width="4"></line>
        <line x1="200" y1="000" x2="200" y2="025" stroke="#ff0000" stroke-width="4"></line>
        <line x1="200" y1="025" x2="000" y2="000" stroke="#ff0000" stroke-width="4"></line>
        </svg>

        <svg class="circle" width="200" heigth="200" viewBox="0 0 200 200" xmlns="http://w3.org">
            <circle cx="100" cy="100" r="80" fill="#3496db" stroke="#2c3e50"stroke-width="4"/>
        </svg>
    </main>
    
    
</body>
</html>
