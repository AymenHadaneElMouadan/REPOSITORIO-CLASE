<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <script type="module">
        import { pokemons } from './pokemons.js';

        for(const pokemon of pokemons){
        const nSel = document.getElementById('eSelPokemons');
        const nOption = document.createElement('option');
        nSel.appendChild(nOption);
        nOption.setAttribute(`value`, pokemon.url.split('/')[6]);

        const nTxtPokemons = document.createTextNode(pokemon.name)
        nOption.appendChild(nTxtPokemons);
        }

    </script>
</head>
<body>
    <h1>Pokemons</h1>
    
    <select id="eSelPokemons">
    <option selected disabled></option>
</body>
</html>
