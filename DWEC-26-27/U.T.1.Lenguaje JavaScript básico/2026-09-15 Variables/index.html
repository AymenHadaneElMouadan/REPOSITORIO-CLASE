<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <style> 
        h1{
            color: blue;
        }
        h2{
            color: green;
        }
        h3{
            color: red
        }
    </style>
    <script>
        console.log("JavaScript o EcmaScript");
        console.log("La última version de JavaScript ES2026");
        console.log("El JavaScript moderno empezó con ES6 (2015)");
        console.log("El JavaScript anterior es ES5 (2009). Ya no hacia falta emplear librerias como JQuery.");
    </script> 
</head>
<body>
    <h1>Introducción a JavaScript</h1>

    <h2>Tipos de datos en EcmaScript</h2>

    <h3>JavaScript es un lenguaje de tipado dinámico</h3>

    <script>
        "use strict";
        
        let variable;
        console.log(variable, typeof(variable));

        variable = 1;
        console.log(variable, typeof(variable));

        variable = 1.1;
        console.log(variable, typeof(variable));
        
        variable = "uno";
        console.log(variable, typeof(variable));

        variable = 'uno';
        console.log(variable, typeof(variable));

        variable = `uno`;
        console.log(variable, typeof(variable));

        variable = true;
        console.log(variable, typeof(variable));

        variable = null;
        console.log(variable, typeof(variable));

        variable = undefined;
        console.log(variable, typeof(variable));

        variable = { nombre: "Aymen", apellidos: "Hadane El Mouadan"};
        console.log(variable, typeof(variable));

        variable = ['dwec', 'dwes', 'diw', 'da'];
        console.log(variable, typeof(variable));

        variable = [1, 1.1, 'uno', undefined, null];
        console.log(variable, typeof(variable));

        function saludo() {
            console.log('Buenos dias');
        }
        console.log(variable, typeof(saludo));
    </script>
</body>
</html>
