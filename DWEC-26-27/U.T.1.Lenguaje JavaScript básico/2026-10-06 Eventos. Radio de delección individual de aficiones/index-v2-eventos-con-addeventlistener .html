<!DOCTYPE html>
<html lang="en">
    <head>
        <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width, initial-scale=1.0">
        <title>Document</title>
    </head>
    <body>
        <h1>Mi aficion favorita</h1>

        <form action="https://www.paginaquenoexiste.com/aficiones.php">
            <section id="eSctAficiones">
                <input type="radio" name="aficion" id="eRadnm" value="nm" onchange="mostrarMensaje(event)"/>


                <label for="eRadnm">Navegar por el mar</label>
            </section>

            <button type="submit">Enviar</button>

        </form>
        <script type="module">
            'use strict';

            const aficiones = [
                {clave: 'cc', valor: 'Conducir coches'},
                {clave: 'em', valor: 'Escuchar musica'},
                {clave: 'sm', valor: 'Salir con mujeres'},
                {clave: 'll', valor: 'Leer libros'},
                {clave: 'sa', valor: 'Salir con amigos'},
                {clave: 'jf', valor: 'Jugar al fútbol'},
                {clave: 'ai', valor: 'Aprender idiomas'},
            ];

            for (const aficion of aficiones) {
            const nSection= document.getElementById('eSctAficiones');
            const nRadio = document.createElement('input');
            nSection.appendChild(nRadio);
            nRadio.setAttribute("type", "radio");
            nRadio.setAttribute("name", "raficion");
            nRadio.setAttribute("id", `eRad${aficion.clave}`);
            nRadio.setAttribute("value", aficion.clave);
            //nRadio.setAttribute('onchange', `mostrarMensaje('${aficion.clave}', this)`);
            nRadio.addEventListener('change', mostrarMensaje);

            const nLabel = document.createElement("label");
            nSection.appendChild(nLabel);
            nLabel.setAttribute("for", `eRad${aficion.clave}`);

            const nText = document.createTextNode(aficion.valor);
            nLabel.appendChild(nText);

            }

            function mostrarMensaje(e) {
                console.log(e);
                const etiqueta = e.target;
                const clave = etiqueta.getAttribute('value');
                console.log(clave);
            }
        </script>
    </body>
</html>
